name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Forge runs on Node 22; the CLI and vitest run on it too.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Manifest
        run: bun run manifest:check
      - name: Test
        run: bun run test:ci
      - name: Acceptance-criteria ledger
        if: always()
        run: bun run ledger
      # Fails on a NEW high or critical advisory in production dependencies, but does not block a merge during the
      # sprint: an advisory someone else publishes should not stop unrelated work days before the deadline.
      - name: Dependency audit (production)
        if: always()
        continue-on-error: true
        run: bun audit --audit-level=high
